name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Lets the release workflow run the same checks before it publishes
  workflow_call:

# When this workflow is called by another one, github.workflow is the name of the caller. The group must
# never be the same as a group of the caller, or the called jobs would wait for it or be cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test backend/tests/OpenShort.Tests --configuration Release

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Keep the frontend stage of backend/Dockerfile on the same major version
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build -- --configuration production

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same context and Dockerfile as the release workflow. Only the runs on main write the layers to the
      # cache: every other run, the release included, reads them. A cache written by a pull request or by a
      # tag can be read by that pull request or tag alone, and would only use up the quota.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: openshort:ci
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      # With the embedded SQLite database: the API answers on its own port and through nginx, and the
      # dashboard is served
      - name: Start the image and check that it answers
        run: |
          docker run -d --name openshort -p 127.0.0.1:8080:8080 -p 127.0.0.1:8081:8081 openshort:ci
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8081/api/auth/setup-status; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' openshort)" != "true" ]; then
              echo "The container stopped"
              exit 1
            fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:8081/api/auth/setup-status
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/api/auth/setup-status
          curl -fsS --max-time 5 http://127.0.0.1:8081/ | grep -q '<app-root'

      - name: Show the container log
        if: ${{ !success() }}
        run: docker logs openshort || true
