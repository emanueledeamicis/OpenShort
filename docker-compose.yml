services:
  openshort:
    image: catokx/openshort:latest
    container_name: openshort
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # --- MySQL Configuration (Uncomment to use MySQL) ---
      # - MYSQL_HOST=mysql
      # - MYSQL_PORT=3306
      # - MYSQL_DATABASE=openshort
      # - MYSQL_USER=openshort
      # - MYSQL_PASSWORD=openshort_password
      # - MYSQL_SSL_MODE=None
      # --- Security (Optional: Auto-generated if omitted) ---
      # - JWT_SECRET_KEY=ChangeMeToASecureRandomKeyAtLeast32CharsLong
      # --- Reverse proxy (Set it when a reverse proxy sits in front of OpenShort, see README) ---
      # - TRUSTED_PROXIES=172.30.0.1
    ports:
      - "8081:8081" # Dashboard (Frontend)
      - "80:8080" # API and Redirects (Backend)
    volumes:
      - openshort-data:/app/data
    restart: unless-stopped

volumes:
  openshort-data:
    name: openshort-data
